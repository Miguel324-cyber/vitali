spring.application.name=backend_vitali

# Conexión al archivo SQLite
spring.datasource.url=jdbc:sqlite:base_anti_sobremedicacion.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Configuración de Hibernate para crear las tablas nuevas sin borrar la de medicamentos
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
