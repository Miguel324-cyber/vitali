# Configuración básica de la aplicación
spring.application.name=backend_vitali
server.port=8080

# Configuración de JWT (que ya tenías configurado)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}

# Duración del token en milisegundos (por defecto 8 horas; antes eran 15 minutos)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1200000}
# El token dura 20 minutos. Mientras el usuario está activo, el frontend lo
# renueva con POST /api/auth/refresh; tras 15 minutos sin actividad cierra la sesión.

# Máximo de pacientes que el administrador puede asignar a un mismo médico.
app.doctor.max-patients=${DOCTOR_MAX_PATIENTS:5}

# ==========================================
# CONFIGURACIÓN DE SQLITE
# ==========================================
# Usa directamente la base de datos ubicada en el escritorio.
spring.datasource.url=jdbc:sqlite:C:/Users/Pc/Desktop/base_anti_sobremedicacion.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
# Cambiado de 'none' a 'update' para que Hibernate cree/actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
# La base clínica contiene tablas SQLite externas; inspeccionarlas una por una
# evita que Hibernate falle al agrupar metadatos de columnas no administradas.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
# Imprimir cada SQL en consola hace lento cada request (sobre todo en Windows).
# Para depurar consultas, cambiar temporalmente a true.
spring.jpa.show-sql=false
# Opción 1 (Recomendada para SQLite en Hibernate moderno):
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# O si prefieres dejar que Hibernate lo intente resolver mediante la estrategia genérica:
# (Asegúrate de quitar cualquier otra línea de dialecto conflictiva)
# Base integrada: usuarios, perfiles, citas y módulo de medicamentos
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.open-in-view=false

# Recuperacion de contrasena (configurar variables de entorno SMTP)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
